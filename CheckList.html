<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writing_Journal</title>
    <link rel="stylesheet" href="style.css" />
     <script src="https://cdn.tailwindcss.com"></script>
     <script src="https://kit.fontawesome.com/17d5dc0279.js" crossorigin="anonymous"></script>

</head>
<body>
     <div class="backbtn">
<a href="index.html"><i class="fa-solid fa-arrow-left fa-2x"></i></a>
    </div>
    <div class="mmbtn"> 
    <button id="langToggle" class="bg-white p-4 m-2 rounded-full text-sm">
        မြန်မာ
    </button></div>
    <section class="HomeSection">
    <h1 class="text-2xl  mb-4 text-center text-bold text-[#2da13a]" data-key="checklist_title" > 📋 Mental Health Checklist</h1>
                <p class="text-gray-600" data-key="checklist_sub">Simple daily habits to check in with yourself.</p>
    </section>
     
   <!-- Mental Health Checklist Section -->
        <section class="bg-white rounded-2xl shadow-sm p-6 m-5 md:p-10 mb-8 border-l-4 border-[#de66b4]">
            <div class="text-center mb-8">
                
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Item 1 -->
                <div class="flex items-center gap-4 p-3 bg-gray-50 rounded-lg hover:bg-gray-100 transition">
                    <img src="assets/meals.jpg" class="w-10 h-10 object-contain">
                    <label class="flex items-center gap-3 cursor-pointer flex-1">
                        <input type="checkbox" class="w-5 h-5">
                        <span data-key="check_1" class="text-gray-700">Have I eaten regular meals?</span>
                    </label>
                </div>

                <!-- Item 2 -->
                <div class="flex items-center gap-4 p-3 bg-gray-50 rounded-lg hover:bg-gray-100 transition">
                    <img src="https://npr.brightspotcdn.com/legacy/sites/vpr/files/201803/kid-sleeping-illustration-victor-brave-istock_0.png" class="w-10 h-10 object-contain">
                    <label class="flex items-center gap-3 cursor-pointer flex-1">
                        <input type="checkbox" class="w-5 h-5">
                        <span data-key="check_2" class="text-gray-700">Am I getting enough sleep?</span>
                    </label>
                </div>

                <!-- Item 3 -->
                <div class="flex items-center gap-4 p-3 bg-gray-50 rounded-lg hover:bg-gray-100 transition">
                    <img src="assets/water_consumption.png" class="w-10 h-10 object-contain">
                    <label class="flex items-center gap-3 cursor-pointer flex-1">
                        <input type="checkbox" class="w-5 h-5">
                        <span data-key="check_3" class="text-gray-700">Did I drink plenty of water?</span>
                    </label>
                </div>

                <!-- Item 4 -->
                <div class="flex items-center gap-4 p-3 bg-gray-50 rounded-lg hover:bg-gray-100 transition">
                    <img src="https://cdn-icons-png.flaticon.com/512/2838/2838838.png" class="w-10 h-10 object-contain">
                    <label class="flex items-center gap-3 cursor-pointer flex-1">
                        <input type="checkbox" class="w-5 h-5">
                        <span data-key="check_4" class="text-gray-700">Have I spent time outside?</span>
                    </label>
                </div>

                <!-- Item 5 -->
                <div class="flex items-center gap-4 p-3 bg-gray-50 rounded-lg hover:bg-gray-100 transition">
                    <img src="https://cdn-icons-png.flaticon.com/512/5649/5649619.png" class="w-10 h-10 object-contain">
                    <label class="flex items-center gap-3 cursor-pointer flex-1">
                        <input type="checkbox" class="w-5 h-5">
                        <span data-key="check_5" class="text-gray-700">Did I take a break from screens?</span>
                    </label>
                </div>

                <!-- Item 6 -->
                <div class="flex items-center gap-4 p-3 bg-gray-50 rounded-lg hover:bg-gray-100 transition">
                    <img src="https://cdn-prod-static.heartfulness.org/7tips_social_connection1_44f3bdfacf.jpg" class="w-10 h-10 object-contain">
                    <label class="flex items-center gap-3 cursor-pointer flex-1">
                        <input type="checkbox" class="w-5 h-5">
                        <span data-key="check_6" class="text-gray-700">Have I connected with others?</span>
                    </label>
                </div>

                <!-- Item 7 -->
                <div class="flex items-center gap-4 p-3 bg-gray-50 rounded-lg hover:bg-gray-100 transition">
                    <img src="assets/kind.jpeg" class="w-10 h-10 object-contain">
                    <label class="flex items-center gap-3 cursor-pointer flex-1">
                        <input type="checkbox" class="w-5 h-5">
                        <span data-key="check_7" class="text-gray-700">Did I do something kind?</span>
                    </label>
                </div>
                <!-- Item 8 -->
                <div class="flex items-center gap-4 p-3 bg-gray-50 rounded-lg hover:bg-gray-100 transition">
                    <img src="https://www.mindful.org/content/uploads/2015/06/lovingkindness_feature.png" class="w-10 h-10 object-contain">
                    <label class="flex items-center gap-3 cursor-pointer flex-1">
                        <input type="checkbox" class="w-5 h-5">
                        <span data-key="check_8" class="text-gray-700">Have I been kind to myself today?</span>
                    </label>
                </div>
                <!-- Item 9 -->
                <div class="flex items-center gap-4 p-3 bg-gray-50 rounded-lg hover:bg-gray-100 transition">
                    <img src="https://cdn-icons-png.flaticon.com/512/6193/6193185.png" class="w-10 h-10 object-contain">
                    <label class="flex items-center gap-3 cursor-pointer flex-1">
                        <input type="checkbox" class="w-5 h-5">
                        <span data-key="check_9" class="text-gray-700">Did I do something I enjoy today?</span>
                    </label>
                </div>
            </div></section>
    
</body>
<footer data-key="FooterCheck"></footer>
<script src="script.js"></script>
</html>
